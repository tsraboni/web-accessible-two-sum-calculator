<!DOCTYPE html>
<html>
  <head>
    <!-- Title shown in the browser tab -->
    <title>Two Sum Solver</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css" />

    <!-- Connect the JavaScript file -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Main page title -->
    <h1>Two Sum Solver</h1>

    <!-- Shows the current array -->
    <h2>Current Array</h2>
    <p id="array-display">[4, 8, 12, 3]</p>

    <!-- User can add a new number -->
    <h2>Add a Number</h2>
    <input id="number-input" type="number" />
    <button id="add-button">Add Number</button>

    <!-- User can remove the last number -->
    <h2>Remove Last Number</h2>
    <button id="pop-button">Remove Last Number</button>

    <!-- User can enter the target value -->
    <h2>Target</h2>
    <input id="target-input" type="number" value="11" />

    <!-- Shows the result from the Two Sum function -->
    <h2>Result</h2>
    <p id="result-display"></p>
  </body>
</html>
